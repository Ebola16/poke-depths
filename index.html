<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Dive into Poké Depths, an animated underwater world where Pokémon swim through a parallax ocean scene. Open-source project on GitHub." />
  <title>Poké Depths</title>
  <link rel="canonical" href="https://ebola16.github.io/poke-depths/" />
  <link rel="stylesheet" href="styles1.css" />
</head>
<body class="loading">
  <header class="page-header">
  <h1>Poké Depths - Dive into an Underwater Pokémon World</h1>
  <p class="page-intro">
    Explore Poké Depths, an underwater parallax experience where Pokémon sprites swim through a layered ocean scene. 
    Open-source and available on <a href="https://github.com/Ebola16/poke-depths" target="_blank" rel="noopener noreferrer">GitHub</a>.
  </p>
  </header>

  <div class="loading-indicator" id="loadingIndicator">Loading underwater world...</div>

  <div class="parallax-container" id="parallaxContainer">
    <div class="layer layer1" data-layer="1">
      <img src="images/layer1.png" alt="Layer 1" />
      <img src="images/layer1.png" alt="Layer 1 duplicate" />
    </div>
    <div class="layer layer2" data-layer="2">
      <img src="images/layer2.png" alt="Layer 2" />
      <img src="images/layer2.png" alt="Layer 2 duplicate" />
    </div>
    <div class="layer layer3" data-layer="3">
      <img src="images/layer3.png" alt="Layer 3" />
      <img src="images/layer3.png" alt="Layer 3 duplicate" />
    </div>
    <div class="layer layer4" data-layer="4">
      <img src="images/layer4.png" alt="Layer 4" />
      <img src="images/layer4.png" alt="Layer 4 duplicate" />
    </div>
    <div class="layer layer5" data-layer="5">
      <img src="images/layer5.png" alt="Layer 5" />
      <img src="images/layer5.png" alt="Layer 5 duplicate" />
    </div>
    <div class="layer layer6" data-layer="6">
      <img src="images/layer6.png" alt="Layer 6" />
      <img src="images/layer6.png" alt="Layer 6 duplicate" />
    </div>
  </div>

  <!-- Info button as direct link -->
    <a class="info-button" href="https://github.com/Ebola16/poke-depths" target="_blank" rel="noopener noreferrer">
      <span class="sr-only">View project on GitHub</span>
    </a>

  <script src="scripts.js"></script>
</body>
</html>
